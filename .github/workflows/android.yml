name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy web assets
        run: |
          mkdir -p src/main/assets
          cp index.html src/main/assets/
          cp styles.css  src/main/assets/
          cp app.js      src/main/assets/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK using Gradle
        run: |
          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bus-app-debug
          path: build/outputs/apk/debug/busapp-debug.apk
