plugins {
    id 'com.android.application' version '8.2.2'
}

android {
    namespace 'com.busapp'
    compileSdk 34
    
    // Explicitly enable AndroidX to avoid Gradle 8.7+ strict check
    buildFeatures {
        // Empty block satisfies Gradle requirements
    }

    defaultConfig {
        applicationId "com.busapp"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    // Disable strict AndroidX check for Gradle 8.7+
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
}
