<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>歡迎使用</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone">

    <!-- 登入畫面 -->
    <section id="screen-login" class="screen screen--active">
      <div class="login-body">
        <div class="brand">
          <div class="brand-logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="34" height="34" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2 3 7v6c0 5 3.8 8.4 9 9 5.2-.6 9-4 9-9V7l-9-5Z"/>
              <path d="m9 12 2 2 4-4"/>
            </svg>
          </div>
          <h1 class="brand-title">我的應用</h1>
          <p class="brand-subtitle">登入以繼續</p>
        </div>

        <form id="login-form" class="form" novalidate>
          <label class="field">
            <span class="field-label">帳號</span>
            <input id="username" class="field-input" type="text"
                   placeholder="請輸入帳號" autocomplete="username">
          </label>

          <label class="field">
            <span class="field-label">密碼</span>
            <span class="field-password">
              <input id="password" class="field-input" type="password"
                     placeholder="請輸入密碼" autocomplete="current-password">
              <button type="button" id="toggle-password" class="eye"
                      aria-label="顯示密碼" aria-pressed="false">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </span>
          </label>

          <label class="remember">
            <input id="remember" type="checkbox">
            <span>記住我</span>
          </label>

          <button type="submit" class="btn-primary">登入</button>

          <a href="#" class="link-forgot">忘記密碼？</a>
        </form>
      </div>

      <footer class="login-footer">
        <span>還沒有帳號？</span>
        <a href="#" class="link-inline">立即註冊</a>
      </footer>
    </section>

    <!-- 歡迎畫面 -->
    <section id="screen-welcome" class="screen">
      <header class="welcome-header">
        <div class="welcome-avatar" id="welcome-avatar" aria-hidden="true">U</div>
        <div class="welcome-id">
          <p class="welcome-hello">歡迎使用 👋</p>
          <h2 class="welcome-name" id="welcome-name">使用者</h2>
        </div>
      </header>

      <main class="welcome-body">
        <!-- 日期時間顯示 -->
        <div class="datetime-card">
          <div class="datetime-date" id="datetime-date"></div>
          <div class="datetime-time" id="datetime-time"></div>
        </div>

        <!-- 行事曆按鈕 -->
        <button type="button" class="calendar-btn" id="show-calendar">
          📅 今日行程 & 校曆
        </button>

        <div class="hero-card">
          <p class="hero-title">你今天想做點什麼？</p>
          <p class="hero-text">這是登入後的歡迎畫面原型，所有內容皆為展示用途。</p>
        </div>

        <div class="tile-grid">
          <button type="button" class="tile" id="tile-bus">
            <span class="tile-icon tile-icon--blue">🚌</span>
            <span class="tile-label">巴士到站</span>
          </button>
          <button type="button" class="tile" id="tile-fav">
            <span class="tile-icon tile-icon--green">⭐</span>
            <span class="tile-label">常用</span>
          </button>
          <button type="button" class="tile">
            <span class="tile-icon tile-icon--amber">📅</span>
            <span class="tile-label">行程</span>
          </button>
          <button type="button" class="tile">
            <span class="tile-icon tile-icon--pink">⚙️</span>
            <span class="tile-label">設定</span>
          </button>
        </div>
      </main>

      <footer class="welcome-footer">
        <button type="button" id="logout" class="btn-secondary">登出</button>
      </footer>
    </section>

    <!-- 巴士到站查詢畫面 -->
    <section id="screen-bus" class="screen">
      <header class="bus-header">
        <button type="button" id="bus-back" class="icon-btn" aria-label="返回歡迎頁">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6"/>
          </svg>
        </button>
        <h2 class="bus-title">巴士到站查詢</h2>
      </header>

      <div class="bus-query">
        <div class="bus-query-row">
          <div class="field">
            <span class="field-label">公司</span>
            <div class="segmented segmented--company" role="group" aria-label="巴士公司">
              <button type="button" class="seg seg--active" data-company="kmb">九</button>
              <button type="button" class="seg" data-company="ctb">城</button>
            </div>
          </div>
          <label class="field field--route">
            <span class="field-label">路線</span>
            <input id="bus-route" class="field-input" type="text"
                   placeholder="88X" autocomplete="off" autocapitalize="characters">
          </label>
          <div class="field field--grow">
            <span class="field-label">方向</span>
            <div class="segmented" role="group" aria-label="行駛方向">
              <button type="button" class="seg seg--active" data-bound="outbound">出站</button>
              <button type="button" class="seg" data-bound="inbound">進站</button>
            </div>
          </div>
        </div>
        <button type="button" id="bus-search" class="btn-primary">查詢站點</button>
      </div>

      <p id="bus-status" class="bus-status" hidden></p>

      <div class="bus-content">
        <ol id="bus-stops" class="stop-list"></ol>
      </div>
    </section>

    <!-- 常用站點畫面 -->
    <section id="screen-fav" class="screen">
      <header class="bus-header">
        <button type="button" id="fav-back" class="icon-btn" aria-label="返回歡迎頁">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6"/>
          </svg>
        </button>
        <h2 class="bus-title">常用站點</h2>
      </header>

      <div class="bus-content">
        <p id="fav-empty" class="fav-empty" hidden>還沒有常用站點，到「巴士到站」點星號加入。</p>
        <ul id="fav-list" class="stop-list"></ul>
      </div>
    </section>

    <!-- 月曆畫面 -->
    <section id="screen-calendar" class="screen">
      <header class="calendar-header">
        <button type="button" id="calendar-back" class="icon-btn" aria-label="返回">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6"/>
          </svg>
        </button>
        <div class="calendar-nav">
          <button type="button" id="prev-month" class="icon-btn-small" aria-label="上一個月">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <h2 class="calendar-title" id="calendar-current-month"></h2>
          <button type="button" id="next-month" class="icon-btn-small" aria-label="下一個月">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>
        <button type="button" id="go-today" class="btn-small">今天</button>
      </header>

      <div class="calendar-weekdays">
        <div class="weekday">日</div>
        <div class="weekday">一</div>
        <div class="weekday">二</div>
        <div class="weekday">三</div>
        <div class="weekday">四</div>
        <div class="weekday">五</div>
        <div class="weekday">六</div>
      </div>

      <div class="calendar-grid" id="calendar-grid">
        <!-- 日期網格將由 app.js 動態生成 -->
      </div>

      <aside class="calendar-sidebar" id="calendar-details">
        <h3 id="selected-date-title"></h3>
        <div class="events-list" id="selected-events">
          <!-- 當天活動將顯示在這裡 -->
        </div>
      </aside>
    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
